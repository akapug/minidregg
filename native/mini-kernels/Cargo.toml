[package]
name = "mini-kernels"
version = "0.1.0"
edition = "2021"
description = "The Rust kernels the compiled Lean host calls through @[extern]: cSHAKE256 and KMAC256 (SP 800-185). Lean keeps the reference definition and the statement; this crate is the implementation; the Lean vectors pin the equality. A kernel computes bytes and decides nothing."

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
sha3 = "0.10"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
