# The one build of the grain launch gate (deploy/candidate/package.py RUST_ROLES: launchGate). The source
# stays beside the launcher it gates, deploy/grain-host/launch-gate.rs; journeys and probes take the
# candidate's bin/launch-gate (LAUNCH_GATE), never a separate rustc build.
[package]
name = "launch-gate"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
libc = "=0.2.189"

[[bin]]
name = "launch-gate"
path = "../../deploy/grain-host/launch-gate.rs"
