worker_processes 1;
pid /var/run/nginx.pid;

events {
	worker_connections 256;
}

http {
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;
	server_tokens off;
	server_name_in_redirect off;
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	access_log off;
	error_log stderr;
	gzip off;
	client_body_temp_path /var/tmp/client_temp;
	proxy_temp_path /var/tmp/proxy_temp;
	fastcgi_temp_path /var/tmp/fastcgi_temp;
	uwsgi_temp_path /var/tmp/uwsgi_temp;
	scgi_temp_path /var/tmp/scgi_temp;

	map $http_x_forwarded_proto $fe_https {
		default "";
		https on;
	}

	server {
		listen 8000 default_server;
		listen [::]:8000 default_server ipv6only=on;
		client_max_body_size 32m;
		server_name localhost;
		root /opt/app/firefly/public;
		add_header X-Content-Type-Options nosniff always;

		location / {
			index index.php;
			try_files $uri $uri/ /index.php?$query_string;
		}
		location ~ \.php$ {
			try_files $uri =404;
			fastcgi_read_timeout 120s;
			fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
			fastcgi_index index.php;
			include /etc/nginx/fastcgi_params;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			fastcgi_param QUERY_STRING $query_string;
			fastcgi_param REQUEST_URI $request_uri;
			fastcgi_param DOCUMENT_ROOT $document_root;
			fastcgi_param HTTPS $fe_https if_not_empty;
			fastcgi_param REDIRECT_STATUS 200;
		}
	}
}
