APP_NAME = Forgejo
RUN_USER = forgejo
RUN_MODE = prod

[database]
DB_TYPE = sqlite3
PATH = /var/forgejo/data/forgejo.db

[repository]
ROOT = /var/forgejo/repositories

[server]
DOMAIN = localhost
HTTP_ADDR = 127.0.0.1
HTTP_PORT = __HTTP_PORT__
ROOT_URL = http://localhost:__HTTP_PORT__/
DISABLE_SSH = true
OFFLINE_MODE = true
LANDING_PAGE = home

[mailer]
ENABLED = false

[service]
REGISTER_EMAIL_CONFIRM = false
ENABLE_NOTIFY_MAIL = false
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = false
ENABLE_REVERSE_PROXY_AUTHENTICATION = true
ENABLE_REVERSE_PROXY_AUTHENTICATION_API = true
ENABLE_REVERSE_PROXY_AUTO_REGISTRATION = true

[picture]
DISABLE_GRAVATAR = true
AVATAR_UPLOAD_PATH = /var/forgejo/avatars

[session]
PROVIDER = file

[log]
ROOT_PATH = /var/forgejo/log
MODE = console
LEVEL = Warn

[security]
INSTALL_LOCK = true
SECRET_KEY = __SECRET_KEY__
INTERNAL_TOKEN = __INTERNAL_TOKEN__
REVERSE_PROXY_AUTHENTICATION_USER = X-Sandstorm-User-Id
REVERSE_PROXY_TRUSTED_PROXIES = 127.0.0.0/8,::1/128
DISABLE_GIT_HOOKS = true

[actions]
ENABLED = false
