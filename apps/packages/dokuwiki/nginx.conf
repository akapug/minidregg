worker_processes 1;
pid /var/run/nginx.pid;

events {
  worker_connections 256;
}

http {
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;
  server_name_in_redirect off;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  error_log stderr;
  gzip off;
  client_body_temp_path /var/tmp/client_temp;
  proxy_temp_path /var/tmp/proxy_temp;
  fastcgi_temp_path /var/tmp/fastcgi_temp;
  uwsgi_temp_path /var/tmp/uwsgi_temp;
  scgi_temp_path /var/tmp/scgi_temp;

  map $http_x_forwarded_proto $fe_https {
    default "";
    https on;
  }

  server {
    listen 8000 default_server;
    listen [::]:8000 default_server ipv6only=on;
    client_max_body_size 1000m;
    server_name localhost;
    root /opt/app/dokuwiki;
    index doku.php;
    add_header X-Content-Type-Options nosniff always;

    location ~ ^/(data|conf|bin|inc|vendor)(/|$) { deny all; }
    location = /install.php { deny all; }

    location / {
      try_files $uri $uri/ @dokuwiki;
    }

    location @dokuwiki {
      rewrite ^/_media/(.*) /lib/exe/fetch.php?media=$1 last;
      rewrite ^/_detail/(.*) /lib/exe/detail.php?media=$1 last;
      rewrite ^/_export/([^/]+)/(.*) /doku.php?do=export_$1&id=$2 last;
      rewrite ^/(.*) /doku.php?id=$1&$args last;
    }

    location ~ \.php$ {
      try_files $uri =404;
      fastcgi_pass unix:/var/run/php-fpm.sock;
      fastcgi_index doku.php;
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param QUERY_STRING $query_string;
      fastcgi_param REQUEST_URI $request_uri;
      fastcgi_param DOCUMENT_ROOT $document_root;
      fastcgi_param HTTPS $fe_https if_not_empty;
      fastcgi_param REDIRECT_STATUS 200;
      fastcgi_intercept_errors on;
    }
  }
}
