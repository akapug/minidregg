# /etc/systemd/system/mini-web.service.d/60-demo-confine.conf — DEMO BOX ONLY.
# The gateway: loopback both ways (Caddy is its only client; the helper is a Unix socket). It is
# in no egress set, so the nftables default-deny keeps it off the network entirely. The floor is
# dregg-infra-demo-vm host/systemd/placeholders/web-gateway.conf, which this unit already carries;
# the demo adds the numbers.
[Unit]
After=nftables.service
[Service]
MemoryMax=512M
TasksMax=128
