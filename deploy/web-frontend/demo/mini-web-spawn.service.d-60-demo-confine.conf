# /etc/systemd/system/mini-web-spawn.service.d/60-demo-confine.conf — DEMO BOX ONLY.
# The helper is root and starts member processes in user-UID.slice through systemd-run, so it
# needs the system bus (not hidden here) and no network at all. The shells and bodies it starts
# run in the MEMBER's slice, not this unit's cgroup, and so inherit the tenant caps
# (user-mini.slice.conf, 1G) and sit in no egress set.
[Unit]
After=nftables.service
[Service]
IPAddressDeny=any
RestrictAddressFamilies=AF_UNIX
MemoryMax=256M
TasksMax=512
