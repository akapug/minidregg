# /etc/systemd/system/mini-session-run@.service.d/60-demo-confine.conf — DEMO BOX ONLY.
# One Discord line as mini-s-NAME. It runs in this unit's cgroup, which is in no egress set:
# the member's line cannot reach the network (it did inherit cg_discord under the sudo runner).
[Unit]
After=nftables.service
[Service]
IPAddressDeny=any
RestrictAddressFamilies=AF_UNIX
