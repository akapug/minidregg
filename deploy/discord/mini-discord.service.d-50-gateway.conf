# /etc/systemd/system/mini-discord.service.d/50-gateway.conf — gateway mode (deploy/discord/INSTALL.md).
# For an application with no Interactions Endpoint URL (Dragon's Egg, 1507638321877090374): the
# bot connects OUT to wss://gateway.discord.gg and takes INTERACTION_CREATE there; answers go to
# https://discord.com/api/v10/interactions/ID/TOKEN/callback. No inbound route is needed.
# The bot token is a systemd credential (root 0600 on disk, readable by this unit only); it
# never enters the environment or argv.
[Service]
Environment=MINI_DISCORD_MODE=gateway
LoadCredential=discord-bot-token:/etc/mini/discord-bot-token
Environment=MINI_DISCORD_BOT_TOKEN_FILE=%d/discord-bot-token
